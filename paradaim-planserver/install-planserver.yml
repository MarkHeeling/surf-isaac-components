# SURF Research Cloud component — Paradaim plan server
#
# Runs the plan server of the Paradaim planner (github.com/MarkHeeling/planner,
# scripts/planserver.py) as a systemd service: a laptop next to the robot asks it
# for a joint trajectory (world, start, goal) over HTTP, validates the answer and
# executes it. The server never moves anything itself.
#
# planserver_mode cpu: stored expert trajectories and the trained model on the CPU.
# planserver_mode gpu: reserved for cuRobo and model + cuRobo on one GPU.
#
# The server has no login: it listens on the WireGuard tunnel IP only. Catalog
# item order: wireguard -> (universal-robots-ursim) -> paradaim-planserver.
---
- name: Paradaim plan server
  hosts: localhost
  connection: local
  become: true

  vars:
    planserver_mode: "cpu"              # "cpu" | "gpu" (gpu is not available yet)

    # --- The planner code ---------------------------------------------------------
    planner_repo: "https://github.com/MarkHeeling/planner.git"
    planner_ref: "master"               # branch, tag or commit
    # For a private repository: a GitHub token (fine-grained, read-only on the repo)
    # as a SURF collaboration secret. Empty = clone without credentials.
    planner_git_token: ""
    # Serve from a checkout that is already on the workspace (e.g. the one used for
    # training, /data/isaac-data/planner) instead of cloning. The component then
    # never touches git in it; update it yourself and restart the service.
    planner_checkout: ""

    # Checkout (unless planner_checkout), Python environment and uv. On the boot
    # disk: recreated by the component, nothing here needs to survive a rebuild.
    planserver_dir: "/opt/planserver"

    # --- What it serves -------------------------------------------------------------
    # Persistent data volume (name or mount path, same rule as isaac_data_root).
    # Relative paths below are relative to it.
    planserver_data_root: "isaac-data"
    # Block directories of the dataset (problems/, pointclouds/, trajectories_s*.zarr),
    # comma/space separated, e.g. "v5/block_00". Empty = the eight environments of the
    # fixture in the repository, so the server answers out of the box.
    planserver_blocks: ""
    # Model checkpoint, e.g. "planner/outputs/<run>/checkpoint.pt". Empty = only the
    # stored expert trajectories (planner "stored"), no "model".
    planserver_checkpoint: ""
    # Distance fields the model computes once per environment (about a second each).
    planserver_esdf_cache: "/var/cache/planserver/esdf"

    # --- Where it listens -----------------------------------------------------------
    # Default = the WireGuard tunnel IP, so the server is never on the public
    # interface. Use 127.0.0.1 without WireGuard (then reach it with an SSH tunnel).
    planserver_bind_address: "10.8.0.1"
    # Not 8770/8771: the planner's dataset server (scripts/dataset_foxglove.py) uses those.
    planserver_port: 8780

    # true (default) = starts at every boot; the CPU mode is light. false = installed
    # but stopped: sudo systemctl start planserver
    planserver_autostart: true

    planserver_user: "planserver"       # system user the service runs as

  tasks:
    # ------------------------------------------------------------ 0. Parameters
    - name: Normalise the mode
      ansible.builtin.set_fact:
        ps_mode: "{{ planserver_mode | string | trim | lower }}"

    - name: Stop on an unknown mode
      ansible.builtin.fail:
        msg: "planserver_mode must be cpu or gpu, not '{{ planserver_mode }}'."
      when: ps_mode not in ['cpu', 'gpu']

    - name: Stop on the gpu mode (not available yet)
      ansible.builtin.fail:
        msg: >-
          planserver_mode=gpu (cuRobo and model + cuRobo) is not available yet. Use cpu:
          stored expert trajectories and the model on the CPU.
      when: ps_mode == 'gpu'

    - name: Paths from the parameters
      ansible.builtin.set_fact:
        ps_volume_dir: >-
          {%- set r = (planserver_data_root | string | trim | regex_replace('/+$', '')) -%}
          {{ r if r.startswith('/') else '/data/' ~ r }}
        ps_planner_dir: >-
          {{ (planner_checkout | string | trim | regex_replace('/+$', ''))
             if (planner_checkout | string | trim | length > 0) else planserver_dir ~ '/planner' }}
        ps_venv: "{{ planserver_dir }}/venv"
        ps_uv: "{{ planserver_dir }}/uv/bin/uv"

    - name: Block directories and checkpoint as absolute paths
      ansible.builtin.set_fact:
        ps_blocks: >-
          {%- set out = [] -%}
          {%- for b in ((planserver_blocks | join(' ')) if planserver_blocks is not string else planserver_blocks)
                       | replace(',', ' ') | replace(';', ' ') | split -%}
          {%- set _ = out.append(b if b.startswith('/') else ps_volume_dir ~ '/' ~ b) -%}
          {%- endfor -%}
          {{ out }}
        ps_checkpoint: >-
          {%- set c = planserver_checkpoint | string | trim -%}
          {{ '' if c | length == 0 else (c if c.startswith('/') else ps_volume_dir ~ '/' ~ c) }}

    # The service would restart forever on an address that does not exist.
    - name: Stop when the bind address is not on this workspace
      ansible.builtin.fail:
        msg: >-
          planserver_bind_address {{ planserver_bind_address }} is not an address of this
          workspace ({{ ansible_all_ipv4_addresses | join(', ') }}). The default is the
          WireGuard tunnel IP: put the wireguard component before this one in the catalog
          item, or set planserver_bind_address=127.0.0.1 and reach the server through an
          SSH tunnel.
      when:
        - planserver_bind_address != '0.0.0.0'
        - not planserver_bind_address.startswith('127.')
        - planserver_bind_address not in (ansible_all_ipv4_addresses | default([]))

    # Listening on the tunnel: start after it (and with it at boot).
    - name: Whether the bind address is the WireGuard tunnel
      ansible.builtin.set_fact:
        ps_on_wireguard: >-
          {{ (ansible_facts['wg0'] | default({})).get('ipv4', {}).get('address', '') == planserver_bind_address }}

    # ------------------------------------------------------------ 1. User and directories
    - name: Packages
      ansible.builtin.apt:
        name: [git, python3-venv, ca-certificates]
        update_cache: true
      tags: [packages]

    - name: Service user
      ansible.builtin.user:
        name: "{{ planserver_user }}"
        system: true
        shell: /usr/sbin/nologin
        home: "{{ planserver_dir }}"
        create_home: false

    - name: Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ planserver_user }}"
        mode: "0755"
      loop:
        - "{{ planserver_dir }}"
        - "{{ planserver_esdf_cache }}"

    # ------------------------------------------------------------ 2. Code
    - name: Clone or update the planner
      when: planner_checkout | string | trim | length == 0
      block:
        - name: Repository address (with the token for a private repository)
          ansible.builtin.set_fact:
            ps_repo_url: >-
              {{ planner_repo | regex_replace('^https://', 'https://x-access-token:' ~ (planner_git_token | trim) ~ '@')
                 if (planner_git_token | trim | length > 0) else planner_repo }}
          no_log: true

        - name: Checkout {{ planner_ref }}
          ansible.builtin.git:
            repo: "{{ ps_repo_url }}"
            dest: "{{ ps_planner_dir }}"
            version: "{{ planner_ref }}"
            force: true
          become_user: "{{ planserver_user }}"
          register: ps_git
          no_log: "{{ planner_git_token | trim | length > 0 }}"

        # The token must not stay in .git/config on the workspace.
        - name: Remove the token from the checkout
          ansible.builtin.command: "git -C {{ ps_planner_dir }} remote set-url origin {{ planner_repo }}"
          become_user: "{{ planserver_user }}"
          changed_when: false

    - name: Check that the checkout has the plan server
      ansible.builtin.stat: { path: "{{ ps_planner_dir }}/scripts/planserver.py" }
      register: ps_script

    - name: Stop when it does not
      ansible.builtin.fail:
        msg: >-
          {{ ps_planner_dir }}/scripts/planserver.py is missing: planner_ref '{{ planner_ref }}'
          (or the checkout in planner_checkout) is older than the plan server.
      when: not ps_script.stat.exists

    - name: Commit that is served
      ansible.builtin.command: "git -c safe.directory={{ ps_planner_dir }} -C {{ ps_planner_dir }} rev-parse --short HEAD"
      register: ps_commit
      changed_when: false
      failed_when: false

    # ------------------------------------------------------------ 3. Python environment
    # uv in its own venv (no curl | sh); the planner's lockfile decides the versions.
    - name: uv
      ansible.builtin.pip:
        name: uv
        virtualenv: "{{ planserver_dir }}/uv"
        virtualenv_command: python3 -m venv
      become_user: "{{ planserver_user }}"

    # UV_PROJECT_ENVIRONMENT keeps the environment in planserver_dir, also when the
    # code is a checkout that belongs to someone else (planner_checkout).
    - name: Python environment from the lockfile (first run downloads torch; several minutes)
      ansible.builtin.command:
        cmd: "{{ ps_uv }} sync --frozen --no-default-groups"
        chdir: "{{ ps_planner_dir }}"
      environment:
        UV_PROJECT_ENVIRONMENT: "{{ ps_venv }}"
        UV_CACHE_DIR: "{{ planserver_dir }}/uv-cache"
        UV_PYTHON_INSTALL_DIR: "{{ planserver_dir }}/python"
        HOME: "{{ planserver_dir }}"
      become_user: "{{ planserver_user }}"
      register: ps_sync
      changed_when: "'Installed' in ps_sync.stderr or 'Uninstalled' in ps_sync.stderr"

    # ------------------------------------------------------------ 4. What it serves
    - name: Check the block directories
      ansible.builtin.stat: { path: "{{ item }}/problems" }
      loop: "{{ ps_blocks }}"
      register: ps_block_stat

    - name: Stop on a block directory without problems/
      ansible.builtin.fail:
        msg: "{{ item.item }} is not a block directory (no problems/ in it). Check planserver_blocks and planserver_data_root."
      loop: "{{ ps_block_stat.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: not (item.stat.isdir | default(false))

    - name: Check the checkpoint
      ansible.builtin.stat: { path: "{{ ps_checkpoint }}" }
      register: ps_checkpoint_stat
      when: ps_checkpoint | length > 0

    - name: Stop on a missing checkpoint
      ansible.builtin.fail:
        msg: "Checkpoint {{ ps_checkpoint }} does not exist. Check planserver_checkpoint and planserver_data_root."
      when:
        - ps_checkpoint | length > 0
        - not ps_checkpoint_stat.stat.exists

    # ------------------------------------------------------------ 5. Service
    - name: Command line client (planserver health | worlds | plan ...)
      ansible.builtin.template:
        src: templates/planserver.sh.j2
        dest: /usr/local/bin/planserver
        mode: "0755"

    - name: Install the plan server systemd unit
      ansible.builtin.template:
        src: templates/planserver.service.j2
        dest: /etc/systemd/system/planserver.service
        mode: "0644"
      register: ps_unit

    - name: Enable + (re)start planserver.service (autostart)
      ansible.builtin.systemd:
        name: planserver.service
        enabled: true
        daemon_reload: true
        state: "{{ 'restarted' if (ps_unit.changed or ps_sync.changed or (ps_git.changed | default(false))) else 'started' }}"
      when: planserver_autostart | bool
      tags: [service]

    - name: Install planserver.service without starting it (on demand)
      ansible.builtin.systemd:
        name: planserver.service
        enabled: false
        daemon_reload: true
      when: not (planserver_autostart | bool)
      tags: [service]

    - name: Wait until the plan server answers
      ansible.builtin.uri:
        url: "http://{{ '127.0.0.1' if planserver_bind_address == '0.0.0.0' else planserver_bind_address }}:{{ planserver_port }}/health"
        return_content: true
      register: ps_health
      until: ps_health.status == 200
      retries: 30
      delay: 2
      when: planserver_autostart | bool
      tags: [service]

    - name: How to reach the plan server
      ansible.builtin.debug:
        msg:
          - "{{ 'Starts at boot.' if (planserver_autostart | bool) else 'On demand: sudo systemctl start planserver (stop: sudo systemctl stop planserver)' }}"
          - "URL: http://{{ planserver_bind_address }}:{{ planserver_port }} (planner {{ ps_commit.stdout | default('?') }} from {{ ps_planner_dir }})"
          - "{{ ('Planners: ' ~ (ps_health.json.planners | join(', ')) ~ '; worlds: ' ~ ps_health.json.n_worlds) if (ps_health.json is defined) else 'Not started, so not checked.' }}"
          - "Blocks: {{ ps_blocks | join(' ') if ps_blocks | length > 0 else 'the fixture in the repository (set planserver_blocks for the dataset)' }}"
          - "Model: {{ ps_checkpoint if ps_checkpoint | length > 0 else 'none (set planserver_checkpoint); only stored trajectories' }}"
          - "On the workspace: planserver health | planserver worlds | planserver plan --world <id> --goal <n>"
          - "Logs: journalctl -u planserver -f"
