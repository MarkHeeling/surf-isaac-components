# SURF Research Cloud component — WireGuard server
#
# A WireGuard server on the workspace, so services (Isaac's WebRTC stream, URSim,
# the plan server, Foxglove) are reached over the tunnel instead of public ports.
# Put it first in a catalog item; the other components bind to the tunnel IP.
# Open only wireguard_port/UDP in the catalog item's access rules.
---
- name: WireGuard server
  hosts: localhost
  connection: local
  become: true

  vars:
    wireguard_port: 51820
    wireguard_address: "10.8.0.1/24"     # server tunnel IP + subnet; clients get .2, .3, ...
    # Client public keys (generate on the client: `wg genkey | tee c.key | wg pubkey`).
    # Comma/space/newline separated. Entry = PUBKEY or PUBKEY@10.8.0.7 (explicit IP);
    # without an IP the N-th entry gets server IP + N. Empty = tunnel up, no peers yet.
    wireguard_peers: ""
    # Endpoint written into the client example config. Default = this host's FQDN;
    # set it via the "Resource" source type (workspace_fqdn) or a fixed public IP.
    wireguard_endpoint: "{{ ansible_fqdn }}"
    # Optional server private key as a SURF collaboration secret (Vault) so the
    # server key survives a rebuild and clients keep working. Empty = generate on
    # the workspace (kept in /etc/wireguard/wg0.key; a rebuild makes a new one).
    wireguard_private_key: ""
    # Public info only (server public key, endpoint): readable by every user.
    wireguard_client_example: "/etc/wireguard-client-example.conf"

  handlers:
    - name: Restart wireguard
      ansible.builtin.systemd: { name: wg-quick@wg0, state: restarted }

  tasks:
    - name: Derive WireGuard facts (server IP, subnet, peer list)
      ansible.builtin.set_fact:
        wg_server_ip: "{{ wireguard_address.split('/')[0] }}"
        wg_subnet_prefix: "{{ wireguard_address.split('/')[0].rsplit('.', 1)[0] }}"
        wg_host_base: "{{ wireguard_address.split('/')[0].rsplit('.', 1)[1] | int }}"
        # accepts a string (comma/space/newline separated) or a list
        wg_peer_list: >-
          {{ ((wireguard_peers | join(' ')) if wireguard_peers is not string else wireguard_peers)
             | replace(',', ' ') | replace(';', ' ') | split }}

    - name: Install WireGuard
      ansible.builtin.apt:
        name: [wireguard, wireguard-tools]
        update_cache: true

    - name: WireGuard config directory
      ansible.builtin.file: { path: /etc/wireguard, state: directory, mode: "0700" }

    - name: Install the server private key from the Vault secret (if provided)
      ansible.builtin.copy:
        dest: /etc/wireguard/wg0.key
        mode: "0600"
        content: "{{ wireguard_private_key | trim }}\n"
      no_log: true
      when: wireguard_private_key | length > 0

    - name: Generate a server private key (no secret provided, none on disk yet)
      ansible.builtin.shell: "umask 077 && wg genkey > /etc/wireguard/wg0.key"
      args:
        executable: /bin/bash
        creates: /etc/wireguard/wg0.key
      when: wireguard_private_key | length == 0

    - name: Derive the server public key
      ansible.builtin.shell: "wg pubkey < /etc/wireguard/wg0.key > /etc/wireguard/wg0.pub && chmod 0644 /etc/wireguard/wg0.pub"
      args: { executable: /bin/bash }
      changed_when: false

    - name: Read server keys
      ansible.builtin.slurp: { src: "{{ item }}" }
      loop: [/etc/wireguard/wg0.key, /etc/wireguard/wg0.pub]
      register: wg_keys
      no_log: true

    - name: Set key facts
      ansible.builtin.set_fact:
        wg_private_key: "{{ wg_keys.results[0].content | b64decode | trim }}"
        wg_public_key: "{{ wg_keys.results[1].content | b64decode | trim }}"
      no_log: true

    - name: Write /etc/wireguard/wg0.conf
      ansible.builtin.template:
        src: templates/wg0.conf.j2
        dest: /etc/wireguard/wg0.conf
        mode: "0600"
      no_log: true
      notify: Restart wireguard

    - name: Allow the WireGuard port in ufw (only if ufw is active)
      ansible.builtin.shell: |
        set -o pipefail
        if ufw status 2>/dev/null | grep -q 'Status: active'; then ufw allow {{ wireguard_port }}/udp; fi
      args: { executable: /bin/bash }
      changed_when: false

    - name: Enable + start wg-quick@wg0
      ansible.builtin.systemd:
        name: wg-quick@wg0
        enabled: true
        state: started

    - name: Flush handlers (apply a changed wg0.conf before checking the tunnel)
      ansible.builtin.meta: flush_handlers

    - name: Check the tunnel is up
      ansible.builtin.command: wg show wg0
      register: wg_show
      changed_when: false
      failed_when: false

    - name: Client example config (public info only; fill in your own private key)
      ansible.builtin.copy:
        dest: "{{ wireguard_client_example }}"
        mode: "0644"
        content: |
          # WireGuard client config for this workspace. Copy to your machine, paste
          # the private key that belongs to the public key you registered in
          # wireguard_peers, and use the Address that the playbook assigned to it
          # (server IP + N for the N-th key, unless you gave PUBKEY@IP).
          [Interface]
          PrivateKey = <your client private key>
          Address = {{ wg_subnet_prefix }}.{{ (wg_host_base | int) + 1 }}/32

          [Peer]
          PublicKey = {{ wg_public_key }}
          Endpoint = {{ wireguard_endpoint }}:{{ wireguard_port }}
          AllowedIPs = {{ wg_server_ip }}/32
          PersistentKeepalive = 25

    - name: Login hint with the server public key and endpoint
      ansible.builtin.copy:
        dest: /etc/update-motd.d/98-wireguard
        mode: "0755"
        content: |
          #!/bin/sh
          echo ""
          echo "  [WireGuard] endpoint {{ wireguard_endpoint }}:{{ wireguard_port }}, tunnel IP {{ wg_server_ip }}"
          echo "  [WireGuard] server public key: $(cat /etc/wireguard/wg0.pub 2>/dev/null)"
          echo "  [WireGuard] client example:    {{ wireguard_client_example }}"
          echo ""

    - name: WireGuard summary
      ansible.builtin.debug:
        msg:
          - "WireGuard up on {{ wireguard_endpoint }}:{{ wireguard_port }}/udp, tunnel IP {{ wg_server_ip }} ({{ wg_peer_list | length }} peer(s))"
          - "Server public key: {{ wg_public_key }}"
          - "Client example: {{ wireguard_client_example }}"
          - >-
            {{ ('No peers configured yet: add client public keys to wireguard_peers (or ad hoc: '
                ~ 'wg set wg0 peer <PUBKEY> allowed-ips ' ~ wg_subnet_prefix ~ '.2/32).')
               if wg_peer_list | length == 0 else 'Peers: ' ~ (wg_peer_list | join(' ')) }}
          - "{{ 'wg show: ' ~ wg_show.stdout_lines[0] if wg_show.rc == 0 else 'WARNING: wg show wg0 failed (rc=' ~ wg_show.rc ~ ')' }}"
