# SURF Research Cloud component — NVIDIA Isaac Sim / Lab / Arena
#
---
- name: NVIDIA Isaac Sim / Lab / Arena container workstation
  hosts: localhost
  connection: local
  become: true

  vars:
    isaac_option: "lab"             # "full-isaac" | "lab" | "sim" | "arena"

    # --- Driver pin --------------------------------------------
    manage_nvidia_driver: true        # false = use drivers from CUDA component
    nvidia_driver_branch: "580"       # R580 production branch (validated for A10/Ampere)
    nvidia_driver_pin_glob: "580.*"   # apt preference pins to this branch (any 580.x)
    nvidia_driver_apt_version: ""     # optional exact apt version (e.g. 580.95.05-0ubuntu1); empty = metapackage (latest 580)

    # --- Images ---------------------------------------------------------------
    # Pre-built NGC images. Pin by DIGEST for a reproducible rollout:
    #   nvcr.io/nvidia/isaac-sim@sha256:<digest>
    # The tag form below rolls to whatever NGC serves for that tag; the digest that
    # was actually pulled is printed by the playbook and written to
    # /etc/isaac/image-digest, so it can be pasted back here (or resolve it from a
    # machine with NGC access: `docker buildx imagetools inspect <image:tag>`).
    #   Isaac Sim 6.1.0 GA (2026-09-10)          -> nvcr.io/nvidia/isaac-sim:6.1.0
    #   Isaac Lab 3.0.0 RC1 / v3.0.0-EA (2026-09-16), built on Isaac Sim 6.1
    #                                             -> nvcr.io/nvidia/isaac-lab:3.0.0-rc1
    # Previous digest pins (Isaac Sim 6.0.x / Isaac Lab 3.0.0-beta2 line):
    #   image_sim: nvcr.io/nvidia/isaac-sim@sha256:c3e7bef5b2bfdb9972807c34195206078372bf8c6cff79716be130a3fe3e9ce9
    #   image_lab: nvcr.io/nvidia/isaac-lab@sha256:970621075d00059c309f847fa835709de3fa634537407a7009c586c97893d218
    image_sim: "nvcr.io/nvidia/isaac-sim:6.1.0"
    image_lab: "nvcr.io/nvidia/isaac-lab:3.0.0-rc1"
    # full-isaac: the "everything" image (full Isaac Sim editor + Isaac Lab + Arena).
    # Default = build from source on the workstation at provisioning (build-on-deploy,
    # ~15 min) so the catalog item is shareable without a registry. Optionally set
    # image_full to a registry digest to pull a pre-built image instead of building.
    image_full: ""    # optional registry override; empty = build from source

    # --- full-isaac build-on-deploy (only used when image_full is empty) -----------
    arena_repo: "https://github.com/isaac-sim/IsaacLab-Arena.git"
    # release/0.3.0 tip (2026-09-15, Arena 0.3 Alpha). Its Dockerfile builds on
    # nvcr.io/nvidia/isaac-sim:6.0.1 with Isaac Lab submodule af1bab4 (3.0 line).
    # Prev: 0a1b8c23 (release/0.2.1, 2026-07-01), baa1b119 (main, 2026-06-23)
    arena_ref: "8737b4ceb25f99f81a81786b7fde73139b52f324"
    arena_src_dir: "/opt/IsaacLab-Arena"

    # Persistent data volume (survives a workspace rebuild). SURF mounts an
    # external volume at /data/<volume-name>, so name the volume "isaac-data".
    isaac_data_root: "/data/isaac-data"
    # Ephemeral scratch: fast local NVMe, auto-added on GPU flavours, wiped on
    # reboot. Holds the regenerable caches; the systemd unit recreates the dirs
    # at each start. SURF guidance: caches -> scratch, persistent data -> volume.
    scratch_root: "/mnt/scratch"
    workspace_user: "{{ ansible_user_id }}"

    # Streaming host advertised to the WebRTC client. Normally set by the catalog
    # item via the "Resource" source type (value: workspace_fqdn), which auto-fills
    # the workspace's DNS name. With wireguard_enabled the playbook overrides it
    # with the tunnel IP (wireguard_address). 127.0.0.1 here is only a local fallback.
    isaacsim_host: "127.0.0.1"
    isaac_signal_port: 49100
    isaac_stream_port: 47998

    # --- WireGuard (optional) ---------------------------------------------------
    # Installs a WireGuard server on the workstation so the WebRTC viewer is reached
    # over the tunnel instead of public ports: open only wireguard_port/UDP in the
    # catalog access rules and the stream is advertised on the tunnel IP.
    wireguard_enabled: false
    wireguard_port: 51820
    wireguard_address: "10.8.0.1/24"     # server tunnel IP + subnet; clients get .2, .3, ...
    # Client public keys (generate on the client: `wg genkey | tee c.key | wg pubkey`).
    # Comma/space/newline separated. Entry = PUBKEY or PUBKEY@10.8.0.7 (explicit IP);
    # without an IP the N-th entry gets server IP + N. Empty = tunnel up, no peers yet.
    wireguard_peers: ""
    # Endpoint written into the client example config. Default = this host's FQDN;
    # set it via the "Resource" source type (workspace_fqdn) or a fixed public IP.
    wireguard_endpoint: "{{ ansible_fqdn }}"
    # Optional server private key as a SURF collaboration secret (Vault) so the
    # server key survives a rebuild and clients keep working. Empty = generate on
    # the workstation (kept in /etc/wireguard/wg0.key; a rebuild makes a new one).
    wireguard_private_key: ""

    # NGC API key via a SURF collaboration secret (Vault) as the var `ngc_api_key`.

  handlers:
    - name: Restart docker
      ansible.builtin.systemd: { name: docker, state: restarted }
    - name: Restart wireguard
      ansible.builtin.systemd: { name: wg-quick@wg0, state: restarted }

  tasks:
    # ---------------------------------------------------- 0. NVIDIA driver R580 pin
    # Runs AFTER the SURF CUDA component. Goal: put the driver on the R580 branch
    # and hold it, so a rebuild/`apt upgrade` does not pull it to 590+.
    - name: Get current NVIDIA driver version
      ansible.builtin.command: nvidia-smi --query-gpu=driver_version --format=csv,noheader
      register: nvidia_current
      changed_when: false
      failed_when: false
      when: manage_nvidia_driver | bool

    - name: Release existing holds (allow driver change)
      ansible.builtin.command: >-
        apt-mark unhold cuda-drivers-{{ nvidia_driver_branch }} cuda-drivers nvidia-driver-{{ nvidia_driver_branch }}
      changed_when: false
      failed_when: false
      when: manage_nvidia_driver | bool

    - name: Purge the old driver if it is NOT on the R580 branch (downgrade requires purge)
      ansible.builtin.shell: |
        apt-get remove --purge -y '^nvidia-.*' 'cuda-drivers*' 'libnvidia-*'
        apt-get autoremove -y
      args: { executable: /bin/bash }
      when:
        - manage_nvidia_driver | bool
        - nvidia_current.stdout is defined
        - nvidia_current.stdout | length > 0
        - not nvidia_current.stdout.startswith(nvidia_driver_branch)

    - name: Install the R580 driver (metapackage from the NVIDIA CUDA repo)
      ansible.builtin.apt:
        name: "cuda-drivers-{{ nvidia_driver_branch }}{{ ('=' + nvidia_driver_apt_version) if nvidia_driver_apt_version else '' }}"
        state: present
        update_cache: true
        allow_downgrade: true
      register: nvidia_install
      when: manage_nvidia_driver | bool

    - name: Hold the driver (block automatic upgrades)
      ansible.builtin.command: "apt-mark hold cuda-drivers-{{ nvidia_driver_branch }}"
      register: nvidia_hold
      changed_when: "'already set on hold' not in nvidia_hold.stdout and 'already set to hold' not in nvidia_hold.stdout"
      when: manage_nvidia_driver | bool

    - name: Apt preference — prefer R580, hard-block 590
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/nvidia-pin-580
        mode: "0644"
        content: |
          Package: *nvidia*
          Pin: version {{ nvidia_driver_pin_glob }}
          Pin-Priority: 1001

          Package: cuda-drivers-590 nvidia-driver-590
          Pin: version *
          Pin-Priority: -1
      when: manage_nvidia_driver | bool

    - name: Report that a reboot is needed to load the new driver
      ansible.builtin.debug:
        msg: >-
          NVIDIA driver changed. The running kernel module only becomes R580 after a reboot;
          isaac.service comes up automatically on the next boot (Restart=on-failure).
      when:
        - manage_nvidia_driver | bool
        - nvidia_install is defined
        - nvidia_install.changed

    - name: Login reminder to reboot while the pinned driver is not active
      ansible.builtin.copy:
        dest: /etc/update-motd.d/99-isaac-driver
        mode: "0755"
        content: |
          #!/bin/sh
          # Shown at SSH login only while the pinned R580 driver is not yet loaded.
          # Disappears automatically once nvidia-smi works (after a reboot).
          if ! nvidia-smi >/dev/null 2>&1; then
            echo ""
            echo "  [Isaac] GPU driver pinned to R580 but not loaded yet."
            echo "  [Isaac] Reboot once to activate it"
            echo ""
          fi
      when: manage_nvidia_driver | bool

    # ------------------------------------------------------------------ 1. Docker Engine
    - name: Keyrings directory
      ansible.builtin.file: { path: /etc/apt/keyrings, state: directory, mode: "0755" }

    - name: Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Docker apt repo (official CE, not Canonical's docker.io)
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker

    - name: Install Docker CE + compose plugin
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        update_cache: true

    - name: Docker enabled + started
      ansible.builtin.systemd: { name: docker, enabled: true, state: started }

    - name: Add workspace user to the docker group
      ansible.builtin.user: { name: "{{ workspace_user }}", groups: docker, append: true }

    # ------------------------------------------------------- 2. NVIDIA Container Toolkit
    - name: Toolkit GPG key + apt repo
      ansible.builtin.shell: |
        curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey \
          | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
        curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list \
          | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' \
          > /etc/apt/sources.list.d/nvidia-container-toolkit.list
      args:
        executable: /bin/bash
        creates: /etc/apt/sources.list.d/nvidia-container-toolkit.list

    - name: Install nvidia-container-toolkit
      ansible.builtin.apt: { name: nvidia-container-toolkit, update_cache: true }

    - name: Configure the nvidia-ctk runtime for docker
      ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker
      notify: Restart docker

    - name: Flush handlers (restart docker before the GPU check)
      ansible.builtin.meta: flush_handlers

    - name: Verify GPU passthrough inside a container
      ansible.builtin.command: docker run --rm --runtime=nvidia --gpus all ubuntu nvidia-smi
      register: gpu_check
      changed_when: false
      failed_when: false        # may fail right after a driver change without reboot, isaac.service recovers on the next boot

    - name: GPU passthrough result
      ansible.builtin.debug:
        msg: "{{ 'GPU passthrough OK' if gpu_check.rc == 0 else 'GPU check failed (rc=' ~ gpu_check.rc ~ ') — likely a reboot is needed after the driver change; check after the next boot.' }}"

    # ------------------------------------------------------------------ 3. NGC login (secret)
    - name: Ensure an NGC API key is provided
      ansible.builtin.fail:
        msg: >-
          No NGC API key found. Create the 'ngc_api_key' collaboration secret
          (Profile -> your collaboration -> Secrets) with a valid NGC key.
      when: ngc_api_key is not defined or (ngc_api_key | length == 0)

    - name: Log in to nvcr.io (key via Vault secret)
      ansible.builtin.shell: "echo \"$NGC_API_KEY\" | docker login nvcr.io -u '$oauthtoken' --password-stdin"
      args: { executable: /bin/bash }
      environment:
        NGC_API_KEY: "{{ ngc_api_key }}"
      no_log: true
      register: ngc_login
      failed_when: false

    - name: Fail clearly if the NGC login did not succeed
      ansible.builtin.fail:
        msg: >-
          NGC login to nvcr.io failed (rc={{ ngc_login.rc }}). Check that the
          'ngc_api_key' collaboration secret holds a valid NGC API key.
      when: ngc_login.rc | default(1) != 0

    # ------------------------------------------------------------ 4. Select + pull image
    - name: Component state directory
      ansible.builtin.file: { path: /etc/isaac, state: directory, mode: "0755" }

    - name: Normalise isaac_option (accept full_isaac as full-isaac)
      ansible.builtin.set_fact:
        isaac_option: "{{ isaac_option | replace('_', '-') }}"

    - name: Fail clearly on an unknown isaac_option
      ansible.builtin.fail:
        msg: "isaac_option='{{ isaac_option }}' is invalid. Use one of: full-isaac, lab, sim, arena."
      when: isaac_option not in ['full-isaac', 'lab', 'sim', 'arena']

    - name: Arena (standalone) not supported yet (no pre-built image)
      ansible.builtin.fail:
        msg: >-
          isaac_option=arena has no pre-built image yet. Arena IS included in the
          'full-isaac' option (built from source) -> use that, or 'sim' / 'lab'.
      when: isaac_option == 'arena'

    # full-isaac with no registry image_full -> build the Arena image from source here
    # (it pulls in Isaac Lab + the full Isaac Sim). ~15 min; uses the NGC login above.
    - name: Install git for the full-isaac source build
      ansible.builtin.apt:
        name: [git, git-lfs]
        update_cache: true
      when:
        - isaac_option == 'full-isaac'
        - image_full | length == 0

    - name: Build the full-isaac image from source (Arena -> Lab + full Sim)
      ansible.builtin.shell: |
        set -e
        # Arena submodules use SSH URLs; rewrite to HTTPS (no SSH key needed).
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        if [ ! -d "{{ arena_src_dir }}/.git" ]; then
          git clone "{{ arena_repo }}" "{{ arena_src_dir }}"
        fi
        cd "{{ arena_src_dir }}"
        git fetch --all --tags --prune
        git checkout "{{ arena_ref }}"
        git submodule update --init --recursive
        docker build --pull --build-arg WORKDIR=/workspaces/isaaclab_arena \
          -t isaaclab_arena:latest -f docker/Dockerfile.isaaclab_arena .
      args:
        executable: /bin/bash
      when:
        - isaac_option == 'full-isaac'
        - image_full | length == 0

    - name: Select image
      ansible.builtin.set_fact:
        # full-isaac: a registry image_full if given, otherwise the locally built tag.
        isaac_image: "{{ image_sim if isaac_option == 'sim' else (image_lab if isaac_option == 'lab' else (image_full if image_full | length > 0 else 'isaaclab_arena:latest')) }}"

    - name: Set container UID and persistent directories per option
      ansible.builtin.set_fact:
        # The images run as root by default. We override to a non-root uid (sim 1234,
        # lab / full-isaac 1000) because SURF's persistent volume squashes root -> root
        # cannot write to /data. This uid owns the persistent dirs (chown below) and is
        # passed to `docker run -u` in the unit, so the three never drift.
        # NB full-isaac is source-built: verify its uid + in-container paths against the
        # built image (probe with `docker inspect` / `ls`, like the lab option).
        isaac_uid: "{{ '1234' if isaac_option == 'sim' else '1000' }}"
        isaac_dirs: "{{ sim_dirs if isaac_option == 'sim' else (full_dirs if isaac_option == 'full-isaac' else lab_dirs) }}"
      vars:
        sim_dirs:
          - "{{ isaac_data_root }}/isaac-sim/cache/main"
          - "{{ isaac_data_root }}/isaac-sim/cache/computecache"
          - "{{ isaac_data_root }}/isaac-sim/config"
          - "{{ isaac_data_root }}/isaac-sim/data"
          - "{{ isaac_data_root }}/isaac-sim/logs"
        # lab: persistent = training output (logs) + user data_storage (NVIDIA's
        # isaac-lab-data volume). The Omniverse/Kit caches are regenerable -> scratch,
        # (re)created by the systemd unit at each start (scratch is wiped on reboot).
        lab_dirs:
          - "{{ isaac_data_root }}/isaac-lab/logs"          # training outputs / checkpoints
          - "{{ isaac_data_root }}/isaac-lab/data_storage"  # user data to preserve between runs
        # full-isaac (Arena source build): persistent logs + data_storage. The /data
        # paths are ours; the in-container targets are set in the unit (verify after build).
        full_dirs:
          - "{{ isaac_data_root }}/full-isaac/logs"
          - "{{ isaac_data_root }}/full-isaac/data_storage"

    - name: Create persistent cache/data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ isaac_uid }}"
        group: "{{ isaac_uid }}"
        recurse: true
      loop: "{{ isaac_dirs }}"

    - name: Pull the pinned image (skipped when full-isaac builds locally)
      ansible.builtin.command: "docker pull {{ isaac_image }}"
      when: not (isaac_option == 'full-isaac' and image_full | length == 0)

    # Record which digest the tag resolved to, so a tag-pinned default can be turned
    # into a digest pin (paste it into image_sim / image_lab) and so a rebuild can be
    # compared against the previous deploy.
    - name: Resolve the pulled image to its registry digest
      ansible.builtin.command: "docker image inspect --format '{{ '{{' }} join .RepoDigests \",\" {{ '}}' }}' {{ isaac_image }}"
      register: isaac_image_digest
      changed_when: false
      failed_when: false
      when: not (isaac_option == 'full-isaac' and image_full | length == 0)

    - name: Write the resolved digest to /etc/isaac/image-digest
      ansible.builtin.copy:
        dest: /etc/isaac/image-digest
        mode: "0644"
        content: |
          # {{ isaac_option }} image pulled by the SURF component on {{ ansible_date_time.date }}
          tag={{ isaac_image }}
          digest={{ isaac_image_digest.stdout | default('') }}
      when:
        - isaac_image_digest is defined
        - isaac_image_digest.rc | default(1) == 0

    - name: Report the resolved digest
      ansible.builtin.debug:
        msg: "{{ isaac_image }} -> {{ isaac_image_digest.stdout | default('(digest not resolved)') }}"
      when: isaac_image_digest is defined

    # ------------------------------------------------------------ 5. WireGuard (optional)
    # A WireGuard server on the workstation: the viewer connects over the tunnel, so no
    # WebRTC ports are opened publicly. Server key: Vault secret (stable) or generated.
    - name: Derive WireGuard facts (server IP, subnet, peer list)
      ansible.builtin.set_fact:
        wg_server_ip: "{{ wireguard_address.split('/')[0] }}"
        wg_subnet_prefix: "{{ wireguard_address.split('/')[0].rsplit('.', 1)[0] }}"
        wg_host_base: "{{ wireguard_address.split('/')[0].rsplit('.', 1)[1] | int }}"
        # accepts a string (comma/space/newline separated) or a list
        wg_peer_list: >-
          {{ ((wireguard_peers | join(' ')) if wireguard_peers is not string else wireguard_peers)
             | replace(',', ' ') | replace(';', ' ') | split }}
      when: wireguard_enabled | bool

    - name: Install WireGuard
      ansible.builtin.apt:
        name: [wireguard, wireguard-tools]
        update_cache: true
      when: wireguard_enabled | bool

    - name: WireGuard config directory
      ansible.builtin.file: { path: /etc/wireguard, state: directory, mode: "0700" }
      when: wireguard_enabled | bool

    - name: Install the server private key from the Vault secret (if provided)
      ansible.builtin.copy:
        dest: /etc/wireguard/wg0.key
        mode: "0600"
        content: "{{ wireguard_private_key | trim }}\n"
      no_log: true
      when:
        - wireguard_enabled | bool
        - wireguard_private_key | length > 0

    - name: Generate a server private key (no secret provided, none on disk yet)
      ansible.builtin.shell: "umask 077 && wg genkey > /etc/wireguard/wg0.key"
      args:
        executable: /bin/bash
        creates: /etc/wireguard/wg0.key
      when:
        - wireguard_enabled | bool
        - wireguard_private_key | length == 0

    - name: Derive the server public key
      ansible.builtin.shell: "wg pubkey < /etc/wireguard/wg0.key > /etc/wireguard/wg0.pub && chmod 0644 /etc/wireguard/wg0.pub"
      args: { executable: /bin/bash }
      changed_when: false
      when: wireguard_enabled | bool

    - name: Read server keys
      ansible.builtin.slurp: { src: "{{ item }}" }
      loop: [/etc/wireguard/wg0.key, /etc/wireguard/wg0.pub]
      register: wg_keys
      no_log: true
      when: wireguard_enabled | bool

    - name: Set key facts
      ansible.builtin.set_fact:
        wg_private_key: "{{ wg_keys.results[0].content | b64decode | trim }}"
        wg_public_key: "{{ wg_keys.results[1].content | b64decode | trim }}"
      no_log: true
      when: wireguard_enabled | bool

    - name: Write /etc/wireguard/wg0.conf
      ansible.builtin.template:
        src: templates/wg0.conf.j2
        dest: /etc/wireguard/wg0.conf
        mode: "0600"
      no_log: true
      notify: Restart wireguard
      when: wireguard_enabled | bool

    - name: Allow the WireGuard port in ufw (only if ufw is active)
      ansible.builtin.shell: |
        set -o pipefail
        if ufw status 2>/dev/null | grep -q 'Status: active'; then ufw allow {{ wireguard_port }}/udp; fi
      args: { executable: /bin/bash }
      changed_when: false
      when: wireguard_enabled | bool

    - name: Enable + start wg-quick@wg0
      ansible.builtin.systemd:
        name: wg-quick@wg0
        enabled: true
        state: started
      when: wireguard_enabled | bool

    - name: Flush handlers (apply a changed wg0.conf before checking the tunnel)
      ansible.builtin.meta: flush_handlers

    - name: Check the tunnel is up
      ansible.builtin.command: wg show wg0
      register: wg_show
      changed_when: false
      failed_when: false
      when: wireguard_enabled | bool

    - name: Client example config (public info only; fill in your own private key)
      ansible.builtin.copy:
        dest: /etc/isaac/wireguard-client-example.conf
        mode: "0644"
        content: |
          # WireGuard client config for the Isaac workstation. Copy to your machine,
          # paste the private key that belongs to the public key you registered in
          # wireguard_peers, and use the Address that the playbook assigned to it
          # (server IP + N for the N-th key, unless you gave PUBKEY@IP).
          [Interface]
          PrivateKey = <your client private key>
          Address = {{ wg_subnet_prefix }}.{{ (wg_host_base | int) + 1 }}/32

          [Peer]
          PublicKey = {{ wg_public_key }}
          Endpoint = {{ wireguard_endpoint }}:{{ wireguard_port }}
          AllowedIPs = {{ wg_server_ip }}/32
          PersistentKeepalive = 25
      when: wireguard_enabled | bool

    - name: Login hint with the server public key and endpoint
      ansible.builtin.copy:
        dest: /etc/update-motd.d/98-isaac-wireguard
        mode: "0755"
        content: |
          #!/bin/sh
          echo ""
          echo "  [Isaac] WireGuard: endpoint {{ wireguard_endpoint }}:{{ wireguard_port }}, tunnel IP {{ wg_server_ip }}"
          echo "  [Isaac] server public key: $(cat /etc/wireguard/wg0.pub 2>/dev/null)"
          echo "  [Isaac] client example:    /etc/isaac/wireguard-client-example.conf"
          echo ""
      when: wireguard_enabled | bool

    - name: Remove the WireGuard login hint when disabled
      ansible.builtin.file: { path: /etc/update-motd.d/98-isaac-wireguard, state: absent }
      when: not (wireguard_enabled | bool)

    - name: WireGuard summary
      ansible.builtin.debug:
        msg:
          - "WireGuard up on {{ wireguard_endpoint }}:{{ wireguard_port }}/udp, tunnel IP {{ wg_server_ip }} ({{ wg_peer_list | length }} peer(s))"
          - "Server public key: {{ wg_public_key }}"
          - "Client example: /etc/isaac/wireguard-client-example.conf"
          - >-
            {{ ('No peers configured yet: add client public keys to wireguard_peers (or ad hoc: '
                ~ 'wg set wg0 peer <PUBKEY> allowed-ips ' ~ wg_subnet_prefix ~ '.2/32).')
               if wg_peer_list | length == 0 else 'Peers: ' ~ (wg_peer_list | join(' ')) }}
          - "{{ 'wg show: ' ~ wg_show.stdout_lines[0] if wg_show.rc == 0 else 'WARNING: wg show wg0 failed (rc=' ~ wg_show.rc ~ ')' }}"
      when: wireguard_enabled | bool

    - name: Advertise the WireGuard tunnel IP to the streaming client
      ansible.builtin.set_fact:
        isaacsim_host: "{{ wg_server_ip }}"
      when: wireguard_enabled | bool

    # ------------------------------------------------------------------ 6. systemd unit
    - name: Install the Isaac systemd unit
      ansible.builtin.template:
        src: templates/isaac-container.service.j2
        dest: /etc/systemd/system/isaac.service
        mode: "0644"

    - name: Enable + start isaac.service
      ansible.builtin.systemd:
        name: isaac.service
        enabled: true
        state: started
        daemon_reload: true
